<!doctype html>

<html lang="it">
  <head>
    <!-- ================================================== -->
    <!-- IMPOSTAZIONI BASE -->
    <!-- ================================================== -->

    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ================================================== -->
    <!-- TITOLO -->
    <!-- ================================================== -->

    <title>News - A.S.D. Judo Bagno a Ripoli</title>

    <!-- ================================================== -->
    <!-- FAVICON -->
    <!-- ================================================== -->

    <link rel="icon" type="image/png" href="./assets/global/logo.png" />

    <!-- ================================================== -->
    <!-- FONT -->
    <!-- ================================================== -->

    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=DM+Serif+Text:ital@0;1&display=swap"
      rel="stylesheet"
    />

    <!-- ================================================== -->
    <!-- CSS GLOBALE -->
    <!-- ================================================== -->

    <link href="./css/style.css" rel="stylesheet" />

    <!-- ================================================== -->
    <!-- CSS NEWS -->
    <!-- ================================================== -->

    <link href="./css/pannello_amministratore.css" rel="stylesheet" />
  </head>

  <body>
    <!-- ================================================== -->
    <!-- HEADER -->
    <!-- ================================================== -->

    <header class="site-header">
      <div class="site-header__background" aria-hidden="true"></div>

      <nav class="site-nav" aria-label="Navigazione principale">
        <a class="site-nav__link" href="index.html"> Home </a>

        <a class="site-nav__link" href="unisciti_a_noi.html">
          Unisciti a noi
        </a>

        <a class="site-nav__link" href="storia.html"> Storia </a>

        <a class="site-nav__link" href="info_e_orari.html"> Info e orari </a>

        <a class="site-nav__link" href="shoku_geiko.html"> Shoku Geiko </a>

        <a class="site-nav__link site-nav__link--active" href="news.html">
          News
        </a>

        <a class="site-nav__link" href="calendario_eventi.html">
          Calendario eventi
        </a>
      </nav>
    </header>

    <!-- ================================================== -->
    <!-- CONTENUTO -->
    <!-- ================================================== -->

    <main>
      <!-- ================================================== -->
      <!-- PANNELLO AMMINISTRATORE -->
      <!-- ================================================== -->

      <div class="pannello_amministratore" id="pannelloAmministratore">
        <!-- ================================================== -->
        <!-- TITOLO -->
        <!-- ================================================== -->

        <span class="testo_pannello_amministratore">
          Pannello amministratore
        </span>

        <!-- ================================================== -->
        <!-- ACCEDI -->
        <!-- ================================================== -->

        <span class="testo_accedi"> Accedi </span>

        <!-- ================================================== -->
        <!-- NOME UTENTE -->
        <!-- ================================================== -->

        <span class="testo_nome_utente"> Nome utente </span>

        <div class="casella_nome_utente">
          <input
            type="text"
            class="input_nome_utente"
            id="inputNomeUtente"
            placeholder="Inserisci il nome utente"
            autocomplete="username"
            spellcheck="false"
          />
        </div>

        <!-- ================================================== -->
        <!-- PASSWORD -->
        <!-- ================================================== -->

        <span class="testo_password"> Password </span>

        <div class="casella_password">
          <input
            type="password"
            class="input_password"
            id="inputPassword"
            placeholder="Inserisci la password"
            autocomplete="current-password"
            spellcheck="false"
          />
        </div>

        <!-- ================================================== -->
        <!-- MOSTRA PASSWORD -->
        <!-- ================================================== -->

        <button
          type="button"
          class="pulsante_mostra_password"
          id="pulsanteMostraPassword"
          aria-label="Mostra password"
          title="Mostra password"
        >
          <div class="icona_mostra_password">  </div>
        </button>

        <!-- ================================================== -->
        <!-- ERRORE -->
        <!-- ================================================== -->

        <div class="errore_accesso" id="erroreAccesso"></div>

        <!-- ================================================== -->
        <!-- ENTRA -->
        <!-- ================================================== -->

        <button type="button" class="pulsante_entra" id="pulsanteEntra">
          <span class="testo_pulsante_entra"> Entra </span>
        </button>
      </div>

      <!-- ================================================== -->
      <!-- JAVASCRIPT -->
      <!-- ================================================== -->

      <script src="./main.js" defer></script>
    </main>

    <!-- ================================================== -->
    <!-- JAVASCRIPT -->
    <!-- ================================================== -->

    <script
      type="module"
      src="./javascript/pannello_amministratore.js"
    ></script>
  </body>
</html>
